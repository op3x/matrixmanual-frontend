<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — ManualOS</title>

<meta name="robots" content="noindex">

<style>
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url("/assets/fonts/ibm-plex-sans-400.woff2") format("woff2");ascent-override:102%;descent-override:27%;line-gap-override:0%}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url("/assets/fonts/ibm-plex-sans-600.woff2") format("woff2");ascent-override:102%;descent-override:27%;line-gap-override:0%}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("/assets/fonts/ibm-plex-mono-500.woff2") format("woff2");ascent-override:102%;descent-override:27%;line-gap-override:0%}
:root{--paper:#f3f0e6;--sheet:#f7f4ec;--ink:#17181a;--yellow:#e6b400}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:"IBM Plex Sans",Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.skip-link{position:absolute;left:.75rem;top:-3rem;background:var(--ink);color:var(--paper);padding:.7rem 1rem;z-index:5;text-decoration:none}
.skip-link:focus{top:.5rem}
header,footer{padding:.35rem .85rem}
header{border-bottom:1px solid var(--ink)}
.logo{display:inline-flex;align-items:center;gap:.55rem;min-height:2.75rem;color:var(--ink);text-decoration:none;font-weight:600;font-size:1.05rem;letter-spacing:-.02em}
.logo-mark{width:1.7rem;height:1.7rem;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:.95rem;border-bottom:3px solid var(--yellow)}
main{flex:1;max-width:40rem;margin:0 auto;padding:2.2rem .85rem;width:100%}
.titleblock{display:grid;grid-template-columns:1.5fr .7fr .7fr;border:1px solid var(--ink);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;margin:0 0 1rem}
.titleblock span{padding:.32rem .45rem;border-left:1px solid var(--ink);min-width:0;overflow-wrap:anywhere}
.titleblock span:first-child{border-left:0}
h1{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0 0 .7rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding:.55rem .9rem;font-weight:600;text-decoration:none;border:1px solid var(--ink);border-radius:0}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:var(--yellow);color:var(--ink)}
.btn-outline{background:var(--sheet);color:var(--ink)}
.btn-outline:hover{background:var(--yellow);color:var(--ink)}
footer{border-top:1px solid var(--ink);color:#3a3f44}
footer a{color:var(--ink);display:inline-flex;align-items:center;min-height:2.75rem}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header>
  <a class="logo" href="/"><span class="logo-mark" aria-hidden="true">M</span>ManualOS</a>
</header>
<main id="main" tabindex="-1">
  <div class="titleblock">
    <span>Doc no. 404</span>
    <span>Rev —</span>
    <span>Sheet —</span>
  </div>
  <h1>That page is not here</h1>
  <p>The address does not match a ManualOS page. The home page has pricing, a sample manual, and checkout.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">Back to home</a>
    <a class="btn btn-outline" href="/#pricing">View pricing</a>
  </div>
</main>
<footer>
  <p><a href="mailto:hello@manualos.com">hello@manualos.com</a></p>
</footer>
</body>
</html>
