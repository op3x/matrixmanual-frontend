<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — ManualOS</title>
<meta name="description" content="That ManualOS page is not here. Go back to the home page or the pricing section.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<meta name="theme-color" content="#fdf6ed">
<style>
:root{--cream:#fdf6ed;--ink:#1c1917;--text:#3f3a36;--accent:#9a3412;--accent-dark:#7c2d12;--line:#e7d7c3}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.skip-link{position:absolute;left:.75rem;top:-3rem;background:var(--ink);color:#fff;padding:.7rem 1rem;z-index:5;border-radius:.4rem;text-decoration:none}
.skip-link:focus{top:.5rem}
header,footer{padding:.75rem 1rem}
header{border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;gap:.6rem;min-height:3rem;color:var(--ink);text-decoration:none;font-family:Georgia,"Iowan Old Style",serif;font-weight:700;font-size:1.25rem}
.logo-mark{width:2rem;height:2rem;border-radius:.4rem;background:var(--accent);color:#fff;display:grid;place-items:center}
main{flex:1;max-width:40rem;margin:0 auto;padding:3rem 1rem;width:100%}
h1{font-family:Georgia,"Iowan Old Style",serif;font-size:clamp(2rem,5vw,2.8rem);color:var(--ink);line-height:1.15;margin:0 0 .8rem}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.4rem}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;padding:.7rem 1.1rem;border-radius:.6rem;font-weight:700;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-outline{background:#fff;color:var(--accent);border:2px solid var(--accent)}
footer{border-top:1px solid var(--line);color:#57534e}
footer a{color:var(--accent)}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header>
  <a class="logo" href="/"><span class="logo-mark" aria-hidden="true">M</span>ManualOS</a>
</header>
<main id="main" tabindex="-1">
  <h1>That page is not here</h1>
  <p>The address does not match a ManualOS page. The site home page has pricing, a sample manual, and how checkout works.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">Back to home</a>
    <a class="btn btn-outline" href="/#pricing">View pricing</a>
  </div>
</main>
<footer>
  <p><a href="mailto:hello@manualos.com">hello@manualos.com</a></p>
</footer>
</body>
</html>
